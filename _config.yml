title: Astrophysics Setup Guide
description: >-
  Gateway for astrophysics computing setup: scientific Python, Git, Docker,
  and links to MESA-in-container docs and study notebooks.
url: https://astr400.github.io
baseurl: ""
lang: en
logo: /assets/logo.png

markdown: kramdown
kramdown:
  input: GFM

# GitHub Pages forces the Rouge highlighter and ignores any attempt to disable
# it, so code blocks build as .language-<lang> wrappers around <pre>. That is
# fine here: assets/site.css deliberately ships no Rouge colour theme, so tokens
# inherit the body colour and blocks keep the plain look the design expects.

plugins:
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap

# Each topic area is a collection. Adding a section means adding an entry here
# and a directory of Markdown; the topbar reads _data/nav.yml, not every page.
collections:
  setup:
    output: true
    permalink: /setup/:name/
  use:
    output: true
    permalink: /use/:name/

defaults:
  - scope:
      path: ""
      type: setup
    values:
      layout: guide
  - scope:
      path: ""
      type: use
    values:
      layout: guide
  - scope:
      path: setup.md
    values:
      layout: hub
      permalink: /setup/
      hub: setup
  - scope:
      path: use.md
    values:
      layout: hub
      permalink: /use/
      hub: use

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - AGENTS.md
  - STYLE.md
  - MARKDOWN.md
  - scripts
  - .tmp
